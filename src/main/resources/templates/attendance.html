<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance · VClass</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><div th:replace="~{fragments :: nav(${user})}"></div><main class="main"><header class="page-top"><div><div class="eyebrow">CLASS PARTICIPATION</div><h1>Attendance</h1><p class="subheading">Keep a clear record of classroom attendance.</p></div><span class="role-pill" th:text="${user.role}">ROLE</span></header><div class="alert success" th:if="${success}" th:text="${success}"></div><section class="panel form-panel" th:if="${user.role == 'TEACHER'}"><div class="eyebrow">DAILY REGISTER</div><h2>Mark attendance</h2><form th:action="@{/attendance}" method="post" class="attendance-form"><label>Course<select name="courseId" required><option value="">Select course</option><option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.title+' · '+c.code}"></option></select></label><label>Student email<input type="email" name="studentEmail" placeholder="student@demo.com" required></label><label>Date<input type="date" name="attendanceDate" th:value="${today}" required></label><label>Status<select name="status"><option value="PRESENT">Present</option><option value="ABSENT">Absent</option></select></label><button class="btn btn-primary">Save attendance →</button></form></section><section class="panel"><div class="panel-heading"><div><div class="eyebrow">ATTENDANCE LOG</div><h2>Recent records</h2></div></div><div th:if="${#lists.isEmpty(records)}" class="empty-state"><span class="empty-icon">◷</span><h3>No attendance records</h3><p>Records appear here after attendance is marked.</p></div><div class="table-wrap" th:unless="${#lists.isEmpty(records)}"><table><thead><tr><th>Date</th><th>Course ID</th><th>Student</th><th>Status</th></tr></thead><tbody><tr th:each="r : ${records}"><td th:text="${r.attendanceDate}"></td><td th:text="${r.courseId}"></td><td th:text="${r.studentEmail}"></td><td><span class="status-pill" th:classappend="${r.status == 'PRESENT'} ? ' present' : ' absent'" th:text="${r.status}"></span></td></tr></tbody></table></div></section></main><script th:src="@{/theme.js}"></script></body></html>
