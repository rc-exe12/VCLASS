<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Courses · VClass</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><div th:replace="~{fragments :: nav(${user})}"></div><main class="main"><header class="page-top"><div><div class="eyebrow">YOUR CLASSROOM</div><h1>Courses</h1><p class="subheading">Organize learning into focused spaces.</p></div><span class="role-pill" th:text="${user.role}">ROLE</span></header><div class="alert success" th:if="${success}" th:text="${success}"></div><div class="alert error" th:if="${error}" th:text="${error}"></div><div class="content-grid"><section class="panel form-panel" th:if="${user.role == 'TEACHER'}"><div class="eyebrow">NEW LEARNING SPACE</div><h2>Create a course</h2><form th:action="@{/courses}" method="post" class="stack-form"><label>Course name<input name="title" placeholder="e.g. Object Oriented Programming" required></label><label>Course code<input name="code" placeholder="e.g. OOPJ" required></label><label>Description<textarea name="description" rows="3" placeholder="What will students learn?"></textarea></label><button class="btn btn-primary">Create course →</button></form></section><section class="panel"><div class="eyebrow">COURSE DIRECTORY</div><h2>All courses</h2><div th:if="${#lists.isEmpty(courses)}" class="empty-state"><span class="empty-icon">▤</span><h3>No courses yet</h3><p>Create the first course using the form.</p></div><div class="course-list" th:unless="${#lists.isEmpty(courses)}"><article class="course-row" th:each="course : ${courses}"><span class="course-icon">▤</span><div><b th:text="${course.title}">Course</b><small th:text="${course.code}">CODE</small><p th:text="${course.description}"></p></div></article></div></section></div></main><script th:src="@{/theme.js}"></script></body></html>
